name: Update QB Data

on:
  schedule:
    # 9 AM Eastern:
    # 13:00 UTC during EDT
    # 14:00 UTC during EST
    #
    # Run at both possible UTC times.
    # The Eastern-time check below determines which one
    # actually runs the R script.
    - cron: "0 13 * * 1,3"
    - cron: "0 14 * * 1,3"

  # Allows manual testing from the Actions tab
  workflow_dispatch:

permissions:
  contents: write


jobs:

  update-data:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT REPOSITORY
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # CHECK EASTERN TIME
      # ------------------------------------------------------

      - name: Check Eastern time
        id: eastern-time
        shell: bash
        run: |

          CURRENT_HOUR=$(TZ="America/New_York" date +%H)

          echo "Current Eastern hour: $CURRENT_HOUR"

          # Manual runs always proceed
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then

            echo "Manual run detected."
            echo "run_update=true" >> "$GITHUB_OUTPUT"

          # Scheduled runs only proceed at 9 AM Eastern
          elif [ "$CURRENT_HOUR" = "09" ]; then

            echo "It is 9 AM Eastern."
            echo "run_update=true" >> "$GITHUB_OUTPUT"

          else

            echo "Not 9 AM Eastern."
            echo "Skipping update."
            echo "run_update=false" >> "$GITHUB_OUTPUT"

          fi


      # ------------------------------------------------------
      # SET UP R
      # ------------------------------------------------------

      - name: Set up R
        if: steps.eastern-time.outputs.run_update == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true


      # ------------------------------------------------------
      # INSTALL CRAN/RSPM PACKAGES
      # ------------------------------------------------------

      - name: Set up R dependencies
        if: steps.eastern-time.outputs.run_update == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::stringr
            any::stringi
            any::cfbfastR


      # ------------------------------------------------------
      # INSTALL espnscrapeR FROM R-UNIVERSE
      # ------------------------------------------------------

      - name: Install espnscrapeR
        if: steps.eastern-time.outputs.run_update == 'true'
        run: |
          Rscript -e 'install.packages("espnscrapeR", repos = c("https://nflverse.r-universe.dev", "https://cloud.r-project.org"))'


      # ------------------------------------------------------
      # RUN R SCRIPT
      # ------------------------------------------------------

      - name: Run QB data update
        if: steps.eastern-time.outputs.run_update == 'true'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |

          echo "Running combine_qb_data.R..."

          Rscript combine_qb_data.R


      # ------------------------------------------------------
      # SHOW CHANGED FILES
      # ------------------------------------------------------

      - name: Show changed files
        if: steps.eastern-time.outputs.run_update == 'true'
        run: |

          echo "Files changed by R script:"

          git status --short


      # ------------------------------------------------------
      # COMMIT AND PUSH UPDATED DATA
      # ------------------------------------------------------

      - name: Commit updated data
        if: steps.eastern-time.outputs.run_update == 'true'
        run: |

          git config --local user.name "github-actions[bot]"

          git config --local user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Only stage the three generated data files
          git add qbseasonspiderdata.csv
          git add spidercompdata.csv
          git add griddata.csv


          # Check whether the generated files actually changed
          if git diff --cached --quiet; then

            echo "No data changes detected."
            echo "Nothing to commit."

          else

            echo "Data changes detected."

            git commit -m "Update QB data"

            git push

          fi
