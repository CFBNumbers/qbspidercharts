name: Update QB Data

on:
  schedule:
    - cron: "0 13 * * 1,3"
    - cron: "0 14 * * 1,3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::stringr
            any::stringi
            any::cfbfastR

      - name: Verify R packages
        run: |
          Rscript -e 'library(dplyr); library(stringr); library(stringi); library(cfbfastR); cat("All R packages loaded successfully.\n")'

      - name: Run QB data update
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          echo "Running combine_qb_data.R..."
          Rscript combine_qb_data.R

      - name: Show changed files
        run: |
          echo "Files changed by R script:"
          git status --short

      - name: Commit updated data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add qbseasonspiderdata.csv
          git add spidercompdata.csv
          git add griddata.csv

          if git diff --cached --quiet; then
            echo "No data changes detected."
            echo "Nothing to commit."
          else
            echo "Data changes detected."
            git commit -m "Update QB data"
            git push
          fi
