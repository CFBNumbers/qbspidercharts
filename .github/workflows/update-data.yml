name: Update QB Data

on:
  schedule:
    # GitHub cron schedules are UTC.
    #
    # 9 AM Eastern is:
    #   13:00 UTC during EDT
    #   14:00 UTC during EST
    #
    # Trigger at both possible times. The timezone check below
    # makes sure the update actually runs only when it is 9 AM
    # in America/New_York.
    - cron: "0 13 * * 1,3"
    - cron: "0 14 * * 1,3"

  # Allows manual runs from the GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-data:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # CHECKOUT REPOSITORY
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # DETERMINE WHETHER IT IS 9 AM EASTERN
      # ------------------------------------------------------

      - name: Check Eastern time
        id: eastern-time
        shell: bash
        run: |
          CURRENT_HOUR=$(TZ="America/New_York" date +%H)

          echo "Current Eastern hour: $CURRENT_HOUR"

          # Always allow manually triggered workflows
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"

          # Scheduled workflow only proceeds at 9 AM Eastern
          elif [ "$CURRENT_HOUR" = "09" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"

          else
            echo "run_update=false" >> "$GITHUB_OUTPUT"
          fi


      # ------------------------------------------------------
      # SET UP R
      # ------------------------------------------------------

      - name: Set up R
        if: steps.eastern-time.outputs.run_update == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true


      # ------------------------------------------------------
      # INSTALL SYSTEM DEPENDENCIES
      # ------------------------------------------------------

      - name: Set up R dependencies
        if: steps.eastern-time.outputs.run_update == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::stringr
            any::stringi
            any::cfbfastR
            any::remotes


      # ------------------------------------------------------
      # INSTALL espnscrapeR
      # ------------------------------------------------------

      - name: Install espnscrapeR
        if: steps.eastern-time.outputs.run_update == 'true'
        run: |
          Rscript -e 'if (!requireNamespace("espnscrapeR", quietly = TRUE)) remotes::install_github("jthomasmock/espnscrapeR")'


      # ------------------------------------------------------
      # RUN DATA UPDATE
      # ------------------------------------------------------

      - name: Run QB data update
        if: steps.eastern-time.outputs.run_update == 'true'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          Rscript update_data.R


      # ------------------------------------------------------
      # SHOW CHANGED FILES
      # ------------------------------------------------------

      - name: Show changed files
        if: steps.eastern-time.outputs.run_update == 'true'
        run: |
          git status --short


      # ------------------------------------------------------
      # COMMIT UPDATED CSV FILES
      # ------------------------------------------------------

      - name: Commit updated data
        if: steps.eastern-time.outputs.run_update == 'true'
        run: |

          git config --local user.name "github-actions[bot]"

          git config --local user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add qbseasonspiderdata.csv
          git add spidercompdata.csv
          git add griddata.csv

          if git diff --cached --quiet; then

            echo "No data changes detected."
            echo "Nothing to commit."

          else

            git commit -m "Update QB data"

            git push

          fi
